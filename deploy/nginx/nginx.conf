# nginx: único servicio expuesto. Cabeceras OWASP A02 y rate limiting.
#
# Los bloques `server` NO viven aquí: viven en templates/factuchat.conf.template,
# que la imagen de nginx procesa con envsubst al arrancar para meterle el dominio
# (FACTUCHAT_DOMINIO). El dominio definitivo todavía no está confirmado y no se
# cablea en el repositorio.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs estructurados para retención 12 meses (A09 / ISO A.8.15)
    log_format json_log escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"referer":"$http_referer",'
        '"ua":"$http_user_agent","request_time":$request_time}';
    access_log /var/log/nginx/access.log json_log;

    sendfile on;
    server_tokens off;

    # Rate limiting global y agresivo en login (fase 1.3 / despliegue #3)
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    # Los formularios públicos de la landing son el buzón de spam natural del
    # sistema. El backend ya limita por IP; esto lo frena antes de llegar.
    limit_req_zone $binary_remote_addr zone=publico:10m rate=20r/m;
    # El webhook del buzón recibe correos enteros: pocas peticiones, pesadas.
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=60r/m;

    # Cabeceras de seguridad (OWASP A02)
    map $sent_http_content_type $csp {
        default "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    }

    # --- TLS (paso 3 del despliegue) -------------------------------------
    # Solo 1.2 y 1.3: 1.0 y 1.1 están retirados y su presencia es un hallazgo
    # directo en cualquier auditoría.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
