' }\n        ] },\n        { wait: 1250, lines: [\n          { t: 'Lo más rápido', w: 700 },\n          { t: '\\nUna recarga de comprobantes para este mismo mes. Sigues facturando en el momento y tu fecha de renovación no cambia.' }\n        ], footer: 'Precio con IVA incluido', cta: { label: 'Recargar comprobantes', href: '#planes' } },\n        { wait: 1250, lines: [\n          { t: 'O cambia de plan', w: 700 },\n          { t: '\\nInicial · $2.99 · 10 comprobantes · 20 días\\nIndependiente · $5.99 · 30 al mes\\nEmprendedor · $9.99 · 80 al mes\\nEmpresario · $24.99 · 250 al mes' }\n        ], cta: { label: 'Ver los planes', href: '#planes' } },\n        { wait: 1000, lines: [{ t: 'Al tocar el botón se abre el pago con la opción ya seleccionada. Apenas se acredita, te aviso aquí mismo y sigues facturando.' }] }\n      ],\n      asesor: [\n        { lines: [{ t: 'Claro. ¿Sobre qué necesitas hablar?' }] },\n        { wait: 900, lines: [{ t: 'Te paso con una persona del equipo. Atendemos de lunes a viernes, de 9h00 a 18h00.' }],\n          replies: [\n            { id: 'asesorTema', label: 'Un tema tributario' },\n            { id: 'asesorTema', label: 'Mi plan o mi pago' },\n            { id: 'asesorTema', label: 'Un problema técnico' }\n          ] }\n      ],\n      asesorTema: [\n        { lines: [{ t: 'Listo, ya avisé al equipo. En unos minutos te escribe una persona por este mismo chat.' }] },\n        { wait: 950, lines: [{ t: 'Mientras tanto sigo disponible: si quieres emitir algo o pedir un reporte, dime nomás.' }],\n          replies: [{ id: 'menu', label: 'Volver al menú' }] }\n      ]\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const openList = (key) => () => this.setState({ sheet: true, sheetView: key });\n    const campo = (k) => (e) => this.setState({ [k]: e.target.value });\n    const abrir = (i) => () => this.setState({ checkout: i, pedidoOk: null, pago: 'whatsapp', agDia: '', agHora: '', fNota: '', archivo: '', archivoUrl: '', archivoPdf: false, archivoPeso: '', menuOpen: false });\n    const LISTA_PAISES = ['Chile', 'Colombia', 'Ecuador', 'Panamá', 'Perú'];\n    const DIVISIONES = {\n      'Ecuador': ['Azuay', 'Bolívar', 'Cañar', 'Carchi', 'Chimborazo', 'Cotopaxi', 'El Oro', 'Esmeraldas', 'Galápagos', 'Guayas', 'Imbabura', 'Loja', 'Los Ríos', 'Manabí', 'Morona Santiago', 'Napo', 'Orellana', 'Pastaza', 'Pichincha', 'Santa Elena', 'Santo Domingo de los Tsáchilas', 'Sucumbíos', 'Tungurahua', 'Zamora Chinchipe'],\n      'Perú': ['Amazonas', 'Áncash', 'Apurímac', 'Arequipa', 'Ayacucho', 'Cajamarca', 'Callao', 'Cusco', 'Huancavelica', 'Huánuco', 'Ica', 'Junín', 'La Libertad', 'Lambayeque', 'Lima', 'Loreto', 'Madre de Dios', 'Moquegua', 'Pasco', 'Piura', 'Puno', 'San Martín', 'Tacna', 'Tumbes', 'Ucayali'],\n      'Chile': ['Antofagasta', 'Arica y Parinacota', 'Atacama', 'Aysén', 'Biobío', 'Coquimbo', 'La Araucanía', 'Los Lagos', 'Los Ríos', 'Magallanes', 'Maule', 'Ñuble', 'O’Higgins', 'Región Metropolitana', 'Tarapacá', 'Valparaíso'],\n      'Colombia': ['Amazonas', 'Antioquia', 'Arauca', 'Atlántico', 'Bogotá D.C.', 'Bolívar', 'Boyacá', 'Caldas', 'Caquetá', 'Casanare', 'Cauca', 'Cesar', 'Chocó', 'Córdoba', 'Cundinamarca', 'Guainía', 'Guaviare', 'Huila', 'La Guajira', 'Magdalena', 'Meta', 'Nariño', 'Norte de Santander', 'Putumayo', 'Quindío', 'Risaralda', 'San Andrés y Providencia', 'Santander', 'Sucre', 'Tolima', 'Valle del Cauca', 'Vaupés', 'Vichada'],\n      'Panamá': ['Bocas del Toro', 'Chiriquí', 'Coclé', 'Colón', 'Darién', 'Emberá-Wounaan', 'Guna Yala', 'Herrera', 'Los Santos', 'Ngäbe-Buglé', 'Panamá', 'Panamá Oeste', 'Veraguas']\n    };\n    const LISTA_PROV = DIVISIONES[s.fPais] || [];\n    const ID_DOC = {\n      'Ecuador': ['Cédula o RUC', '1712345678'],\n      'Perú': ['DNI o RUC', '45678912'],\n      'Chile': ['RUT', '12.345.678-9'],\n      'Colombia': ['Cédula o NIT', '1020304050'],\n      'Panamá': ['Cédula o RUC', '8-123-4567']\n    };\n    const filtra = (lista, q, sel, pick) => {\n      const n = this.norm(String(q || '').trim());\n      const base = n ? lista.filter(x => this.norm(x).includes(n)) : lista.slice();\n      if (n) base.sort((a, b) => {\n        const pa = this.norm(a).startsWith(n) ? 0 : 1, pb = this.norm(b).startsWith(n) ? 0 : 1;\n        return pa - pb || a.localeCompare(b, 'es');\n      });\n      return base.map(x => ({\n        label: x, sel: x === sel, pick: () => pick(x),\n        bg: x === sel ? 'rgba(34,197,94,.1)' : 'transparent',\n        color: x === sel ? '#123D2F' : '#3E5A4E',\n        peso: x === sel ? 600 : 400\n      }));\n    };\n\n    const DOW = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];\n    const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];\n    const hoy = new Date();\n    const dias = [];\n    for (let i = 0; dias.length < 7 && i < 20; i++) {\n      const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + i);\n      if (d.getDay() === 0) continue;\n      const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n      const sel = s.agDia === iso;\n      dias.push({\n        iso, dow: DOW[d.getDay()], dia: String(d.getDate()), mes: MES[d.getMonth()],\n        bg: sel ? 'rgba(92,230,143,.16)' : 'rgba(255,255,255,.05)',\n        borde: sel ? '#5CE68F' : 'rgba(255,255,255,.13)',\n        num: sel ? '#FFFFFF' : '#DDE8E0',\n        sem: sel ? '#5CE68F' : '#8FB3A0',\n        pick: () => this.setState({ agDia: iso })\n      });\n    }\n    const horas = [];\n    for (let h = 7; h <= 21; h++) {\n      const label = String(h).padStart(2, '0') + ':00';\n      const sel = s.agHora === label;\n      horas.push({\n        label,\n        bg: sel ? 'rgba(92,230,143,.18)' : 'rgba(255,255,255,.05)',\n        borde: sel ? '#5CE68F' : 'rgba(255,255,255,.13)',\n        color: sel ? '#FFFFFF' : '#B6CBBE',\n        pick: () => this.setState({ agHora: label })\n      });\n    }\n\n    const catPlanes = this.planesCat();\n    const co = catPlanes[s.checkout] || catPlanes[2];\n    const tono = (m) => ({\n      bg: s.pago === m ? 'rgba(34,197,94,.09)' : '#EEF1EC',\n      borde: s.pago === m ? '#22C55E' : '#DDE3DC',\n      dot: s.pago === m ? '#16794A' : '#B7C4BB',\n      escala: s.pago === m ? 1 : 0\n    });\n    const tr = tono('transferencia'), tj = tono('tarjeta'), wa = tono('whatsapp');\n    const faltaAgenda = s.pago === 'whatsapp' && (!s.agDia || !s.agHora);\n    const bloq = faltaAgenda || !s.cond || !s.datos || (s.pago === 'transferencia' && !s.archivo);\n\n    const heights = [7,12,18,9,15,21,11,16,8,19,13,22,10,17,6,14,20,9,12,7,16,11];\n    const messages = s.msgs.map(m => ({\n      align: m.mine ? 'flex-end' : 'flex-start',\n      bg: m.mine ? '#E7FFDB' : '#FFFFFF',\n      mine: !!m.mine, time: m.time, footer: m.footer,\n      lines: (m.lines || []).map(l => ({ t: l.t, w: l.w || 400 })),\n      isAudio: !!m.isAudio, bars: m.isAudio ? heights.map(h => ({ h: h + 'px' })) : [],\n      hasDoc: !!m.doc,\n      docKind: m.doc ? m.doc.kind : '', docName: m.doc ? m.doc.name : '', docMeta: m.doc ? m.doc.meta : '',\n      docBg: m.mine ? '#D7F5C4' : '#F5F6F6',\n      hasButton: !!m.button, buttonLabel: m.button || '',\n      hasFlow: !!m.flow, flowLabel: m.flow || '', openFlow: () => this.setState({ flowOn: true }),\n      openList: m.list ? openList(m.list) : null,\n      hasCta: !!m.cta, ctaLabel: m.cta ? m.cta.label : '', ctaHref: m.cta ? m.cta.href : '#',\n      hasReplies: !!(m.replies && m.replies.length),\n      replies: (m.replies || []).map(r => ({ label: r.label, go: () => this.run(r.id, r.label) }))\n    }));\n\n    let list = null;\n    if (s.sheetView === 'results' && s.results) {\n      const r = s.results;\n      const gestion = r.mode === 'gestion';\n      const ficha = r.kind === 'cliente' ? 'fichaCliente' : 'fichaServicio';\n      const pag = r.page || 0, porPag = 7;\n      const tramo = r.rows.slice(pag * porPag, pag * porPag + porPag);\n      const restan = r.rows.length - (pag + 1) * porPag;\n      const corta = (t) => t.length > 24 ? t.slice(0, 23) + '…' : t;\n      const acciones = [];\n      if (restan > 0) acciones.push({ id: '__more', label: 'Ver más coincidencias', hint: restan === 1 ? 'Queda 1 más en tu lista' : 'Quedan ' + restan + ' más en tu lista' });\n      list = { title: r.title, sections: [\n        { title: pag === 0 ? 'Lo que más se parece' : 'Más coincidencias', rows: tramo.map(row => ({ label: corta(row.label), hint: row.hint, id: gestion ? ficha : row.key, rec: row })) },\n        { rows: acciones.concat(r.kind === 'cliente'\n          ? [{ id: gestion ? 'buscarCliente' : 'factura', label: 'Buscar de nuevo' }, { id: gestion ? 'agregarCliente' : 'nuevoCliente', label: 'Es un cliente nuevo' }]\n          : [{ id: gestion ? 'buscarServicio' : 'cliente', label: 'Buscar de nuevo' }]) }\n      ] };\n    } else if (s.sheetView) {\n      list = this.lists()[s.sheetView];\n    }\n\n    const faqData = [\n      ['¿Puede facturar más de una persona desde mi cuenta?', 'Desde el plan Emprendedor puedes autorizar un segundo número de WhatsApp además del tuyo. Los dos emiten sobre la misma cuenta, con tus clientes, tus servicios y tu numeración.\\n\\nSirve para que tu socio, tu asistente o quien atiende el local facture sin pasarte los datos por otro lado. Los comprobantes se descuentan del mismo plan y quedan en un solo historial.'],\n      ['¿Se me pierden los comprobantes que no uso?', 'Depende del plan. Desde Emprendedor en adelante, si un mes emites menos de lo que incluye tu plan, los comprobantes que te sobran pasan al mes siguiente y se suman a los nuevos.\\n\\nEn los planes de entrada tienen fecha: los 10 de Inicial valen 20 días o hasta que se agoten, y los 30 de Independiente son del mes en curso.'],\n      ['¿Qué pasa con mis comprobantes si dejo vencer el plan?', 'Tienes diez días de gracia. Al terminar tu ciclo, los comprobantes que traías acumulados siguen vigentes ese plazo.\\n\\nSi renuevas dentro de los diez días, los conservas y se suman a los del nuevo mes. Pasado ese plazo sin renovar, lo acumulado se cierra.\\n\\nTus comprobantes ya emitidos no se tocan: siguen guardados y los puedes consultar o reenviar cuando quieras.'],\n      ['¿Necesito WhatsApp Business?', 'No. Usas tu WhatsApp de siempre, el mismo con el que le escribes a tu familia. El menú y los botones aparecen solos dentro del chat porque los enviamos nosotros desde la plataforma oficial de WhatsApp Business.\\n\\nTú no instalas ni configuras nada.'],\n      ['¿Esto es válido ante el SRI?', 'Sí. Cada comprobante se firma con tu certificado digital y se envía al SRI para su autorización, bajo el esquema de facturación electrónica vigente. Recibes el XML autorizado y el RIDE en PDF, que es el respaldo que le entregas a tu cliente.'],\n      ['No sé nada de contabilidad. ¿Igual me sirve?', 'Está hecho justamente para eso. Eliges del menú, respondes en tus palabras y Factuchat arma el documento con los códigos correctos. Antes de enviar nada al SRI te muestra un resumen en español simple para que confirmes.'],\n      ['¿Qué es la firma electrónica y dónde la consigo?', 'Es un archivo .p12 que te identifica ante el SRI y sin el cual no se puede emitir nada electrónico. Lo emite el Banco Central o Security Data, entre otros, y se tramita en línea.\\n\\nSi no lo tienes, te acompañamos paso a paso a sacarlo. Es un trámite de una sola vez.'],\n      ['Estoy en RIMPE Emprendedor. ¿Me sirve?', 'Sí, es el perfil para el que está pensado. RIMPE no obliga a llevar contabilidad, así que estás en el mismo grupo que una persona natural no obligada.\\n\\nEmites factura, declaras IVA cada semestre y tus clientes grandes te retienen: Factuchat guarda esas retenciones porque son crédito en tu declaración anual.'],\n      ['¿Puedo mandarle notas de voz?', 'Por ahora no: Factuchat funciona con texto para garantizar precisión. Desde el plan Independiente puedes enviarle PDF y fotos de facturas: los lee y los analiza.\\n\\nEn cualquier plan el texto sigue siendo la vía más precisa: un RUC tiene trece dígitos y un monto lleva centavos, y escritos no hay margen de duda. Antes de enviar nada al SRI te muestra el resumen para que confirmes.'],\n      ['¿Hay un límite de texto por mensaje?', 'Sí, aunque en la práctica casi nadie lo alcanza. Si le escribes un mensaje muy largo, Factuchat te pide que lo resumas en unas cuatro líneas.\\n\\nNo es un capricho: un mensaje concreto se resuelve en un paso. Con \"factura a Andrade por consultoría, 450\" ya tiene todo lo que necesita.'],\n      ['¿Pedirle reportes o guardar clientes gasta mi plan?', 'No. Solo cuentan los comprobantes que se envían al SRI. Consultar, buscar, reenviar, pedir reportes, crear clientes y crear servicios es ilimitado en todos los planes.'],\n      ['¿Y si un mes emito más de lo que incluye mi plan?', 'Te aviso antes de que llegues al límite, por el mismo chat. Desde ahí puedes hacer una recarga de comprobantes para ese mismo mes, sin cambiar tu fecha de renovación, o subir al plan que te alcance.\\n\\nSi estabas en Independiente o Emprendedor, lo que traías acumulado se conserva.'],\n      ['¿Puedo probarlo sin suscribirme?', 'Sí, con el paquete Inicial: pagas $2.99 una sola vez y tienes quince comprobantes por veinte días, o hasta que los uses. No se renueva solo.\\n\\nLo que emitas ahí es real: firmado con tu certificado y autorizado por el SRI. Si te sirve, pasas a un plan mensual y tus documentos quedan donde están.'],\n      ['¿Puedo cancelar cuando quiera?', 'Sí, sin plazos forzosos ni penalidad. Tus comprobantes quedan disponibles para que los descargues, y el respaldo se conserva por los siete años que exige la normativa tributaria.']\n    ];\n\n    const faqs = faqData.map((f, i) => ({\n      q: f[0], a: f[1], open: s.openFaq === i, sign: s.openFaq === i ? '−' : '+',\n      n: 'Q' + String(i + 1).padStart(2, '0'),\n      numColor: s.openFaq === i ? '#16794A' : '#5A7267',\n      rot: s
