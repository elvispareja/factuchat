document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\"font-family:'Familjen Grotesk',sans-serif;font-size:28px;line-height:1.08;letter-spacing:-.03em;font-weight:700;margin:0 0 9px;color:#FFFFFF;text-wrap:balance\">¿En qué país facturas?<\u002Fh2>\n        <p style=\"font-size:14.5px;line-height:1.55;color:#A9C7B6;margin:0 0 24px;max-width:38ch;text-wrap:pretty\">Así te mostramos los documentos y los datos que pide tu entidad tributaria.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <button sc-camel-on-click=\"{{ pickEc }}\" type=\"button\" style=\"width:100%;display:flex;align-items:center;gap:14px;text-align:left;font-family:inherit;background:rgba(92,230,143,.1);border:1px solid rgba(92,230,143,.45);border-radius:15px;padding:14px 16px;cursor:pointer;transition:border-color .25s,background .25s,transform .3s cubic-bezier(.16,1,.3,1)\" style-hover=\"border-color:#5CE68F;background:rgba(92,230,143,.13);transform:translateX(4px)\">\n            <svg width=\"30\" height=\"21\" sc-camel-view-box=\"0 0 20 14\" style=\"display:block;border-radius:2.5px;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.14)\"><rect width=\"20\" height=\"7\" fill=\"#FFDD00\"><\u002Frect><rect y=\"7\" width=\"20\" height=\"3.5\" fill=\"#0047A0\"><\u002Frect><rect y=\"10.5\" width=\"20\" height=\"3.5\" fill=\"#EC1C24\"><\u002Frect><\u002Fsvg>\n            <span style=\"flex:1;min-width:0;font-family:'Familjen Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;color:#FFFFFF\">Ecuador<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600;color:#5CE68F;white-space:nowrap\">Disponible<\u002Fspan>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ pickPa }}\" type=\"button\" style=\"width:100%;display:flex;align-items:center;gap:14px;text-align:left;font-family:inherit;background:rgba(92,230,143,.1);border:1px solid rgba(92,230,143,.45);border-radius:15px;padding:14px 16px;cursor:pointer;transition:border-color .25s,background .25s,transform .3s cubic-bezier(.16,1,.3,1)\" style-hover=\"border-color:#5CE68F;background:rgba(92,230,143,.13);transform:translateX(4px)\">\n            <svg width=\"30\" height=\"21\" sc-camel-view-box=\"0 0 20 14\" style=\"display:block;border-radius:2.5px;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.14)\"><rect width=\"20\" height=\"14\" fill=\"#FFFFFF\"><\u002Frect><rect x=\"10\" width=\"10\" height=\"7\" fill=\"#D21034\"><\u002Frect><rect y=\"7\" width=\"10\" height=\"7\" fill=\"#005293\"><\u002Frect><path d=\"M5 1.8l.6 1.7h1.8L5.9 4.6l.6 1.8L5 5.3 3.5 6.4l.6-1.8L2.6 3.5h1.8z\" fill=\"#005293\"><\u002Fpath><path d=\"M15 8.8l.6 1.7h1.8l-1.5 1.1.6 1.8-1.5-1.1-1.5 1.1.6-1.8-1.5-1.1h1.8z\" fill=\"#D21034\"><\u002Fpath><\u002Fsvg>\n            <span style=\"flex:1;min-width:0;font-family:'Familjen Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;color:#FFFFFF\">Panamá<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600;color:#5CE68F;white-space:nowrap\">Disponible<\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"width:100%;display:flex;align-items:center;gap:14px;text-align:left;font-family:inherit;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:14px 16px;cursor:not-allowed;opacity:.5\">\n            <svg width=\"30\" height=\"21\" sc-camel-view-box=\"0 0 20 14\" style=\"display:block;border-radius:2.5px;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.14)\"><rect width=\"20\" height=\"14\" fill=\"#FFFFFF\"><\u002Frect><rect width=\"6.67\" height=\"14\" fill=\"#D91023\"><\u002Frect><rect x=\"13.33\" width=\"6.67\" height=\"14\" fill=\"#D91023\"><\u002Frect><\u002Fsvg>\n            <span style=\"flex:1;min-width:0;font-family:'Familjen Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;color:#FFFFFF\">Perú<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600;color:#8FB3A0;white-space:nowrap\">Muy pronto<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"width:100%;display:flex;align-items:center;gap:14px;text-align:left;font-family:inherit;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:14px 16px;cursor:not-allowed;opacity:.5\">\n            <svg width=\"30\" height=\"21\" sc-camel-view-box=\"0 0 20 14\" style=\"display:block;border-radius:2.5px;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.14)\"><rect width=\"20\" height=\"7\" fill=\"#FCD116\"><\u002Frect><rect y=\"7\" width=\"20\" height=\"3.5\" fill=\"#003893\"><\u002Frect><rect y=\"10.5\" width=\"20\" height=\"3.5\" fill=\"#CE1126\"><\u002Frect><\u002Fsvg>\n            <span style=\"flex:1;min-width:0;font-family:'Familjen Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;color:#FFFFFF\">Colombia<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600;color:#8FB3A0;white-space:nowrap\">Muy pronto<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"width:100%;display:flex;align-items:center;gap:14px;text-align:left;font-family:inherit;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:14px 16px;cursor:not-allowed;opacity:.5\">\n            <svg width=\"30\" height=\"21\" sc-camel-view-box=\"0 0 20 14\" style=\"display:block;border-radius:2.5px;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.14)\"><rect width=\"20\" height=\"7\" fill=\"#FFFFFF\"><\u002Frect><rect y=\"7\" width=\"20\" height=\"7\" fill=\"#D52B1E\"><\u002Frect><rect width=\"7\" height=\"7\" fill=\"#0039A6\"><\u002Frect><path d=\"M3.5 1.6l.62 1.9h2l-1.62 1.18.62 1.9L3.5 5.4 1.88 6.58l.62-1.9L.88 3.5h2z\" fill=\"#FFFFFF\"><\u002Fpath><\u002Fsvg>\n            <span style=\"flex:1;min-width:0;font-family:'Familjen Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;color:#FFFFFF\">Chile<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:600;color:#8FB3A0;white-space:nowrap\">Muy pronto<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.09);font-size:13px;line-height:1.55;color:#8FB3A0;text-wrap:pretty\">Ecuador y Panamá ya están en operación. Los demás se habilitan en cuanto cerremos la integración con su entidad tributaria.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ modalLegal }}\">\n  <div sc-camel-on-click=\"{{ fondoLegal }}\" style=\"position:fixed;inset:0;z-index:112;background:rgba(6,20,15,.6);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;animation:fiSheetIn .3s cubic-bezier(.16,1,.3,1) both\">\n    <div style=\"position:relative;width:100%;max-width:620px;background:#FFFFFF;border:1px solid #E4E9E2;border-radius:24px;box-shadow:0 44px 88px -34px rgba(18,61,47,.62);max-height:86vh;display:flex;flex-direction:column;overflow:hidden\">\n\n      <div style=\"flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:26px 28px 18px;border-bottom:1px solid #EFF2EE\">\n        <div>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#16794A;margin-bottom:6px\">Documento legal<\u002Fdiv>\n          <h3 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:22px;letter-spacing:-.026em;font-weight:700;margin:0;color:#123D2F;text-wrap:balance\">Términos de uso y tratamiento de datos<\u002Fh3>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ cerrarLegal }}\" type=\"button\" aria-label=\"Cerrar\" style=\"width:36px;height:36px;flex-shrink:0;padding:0;border:1px solid #E4E9E2;background:#FBFCFA;border-radius:11px;cursor:pointer;display:grid;place-items:center;transition:border-color .25s\" style-hover=\"border-color:#123D2F\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3E5A4E\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M5 5l14 14M19 5L5 19\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <div data-r=\"listbox\" style=\"flex:1;min-height:0;overflow-y:auto;padding:22px 28px 26px\">\n        <h4 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:16px;letter-spacing:-.02em;font-weight:700;margin:24px 0 9px;color:#123D2F\">1. Qué es Factuchat<\u002Fh4>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">Factuchat es un servicio de facturación electrónica que opera por WhatsApp. Emite comprobantes autorizados ante el SRI usando tu certificado de firma electrónica, y guarda tus documentos para que puedas consultarlos y reenviarlos.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">El servicio no reemplaza a tu contador ni presta asesoría tributaria. Tú eres responsable de la veracidad de los datos que declaras y de la presentación de tus obligaciones ante la administración tributaria.<\u002Fp>\n        <h4 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:16px;letter-spacing:-.02em;font-weight:700;margin:24px 0 9px;color:#123D2F\">2. Tu cuenta y tu firma<\u002Fh4>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">Para emitir necesitas subir tu certificado de firma electrónica. Se almacena cifrado y se usa únicamente para firmar los comprobantes que tú autorizas. No lo compartimos con terceros ni lo usamos para otro fin.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">Eres responsable del número de WhatsApp asociado a tu cuenta y de los números adicionales que autorices. Cualquier comprobante emitido desde esos números se considera emitido por ti.<\u002Fp>\n        <h4 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:16px;letter-spacing:-.02em;font-weight:700;margin:24px 0 9px;color:#123D2F\">3. Planes, pagos y vigencia<\u002Fh4>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">Los planes se cobran por adelantado e incluyen una cantidad determinada de comprobantes. Los precios se muestran con IVA incluido. En los planes que lo indican, los comprobantes no utilizados se acumulan al mes siguiente; en los demás corresponden al período contratado.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">Al terminar tu ciclo cuentas con diez días de gracia para renovar y conservar lo acumulado. Pasado ese plazo sin renovación, el saldo acumulado se cierra. Tus comprobantes ya emitidos permanecen disponibles.<\u002Fp>\n        <h4 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:16px;letter-spacing:-.02em;font-weight:700;margin:24px 0 9px;color:#123D2F\">4. Uso correcto del servicio<\u002Fh4>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">El asistente trabaja con texto y con los archivos que tu plan permita. Antes de enviar cualquier documento al SRI te muestra un resumen para que confirmes. Una vez autorizado un comprobante, su anulación se realiza mediante los mecanismos que establece la normativa.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">No está permitido usar el servicio para emitir comprobantes falsos, suplantar a otra persona o vulnerar la normativa tributaria vigente.<\u002Fp>\n        <h4 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:16px;letter-spacing:-.02em;font-weight:700;margin:24px 0 9px;color:#123D2F\">5. Qué datos recogemos<\u002Fh4>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">Recogemos los datos que nos entregas para prestar el servicio: nombres y apellidos, documento de identificación, correo, teléfono, país, provincia y ciudad, además de los datos de tus clientes y de los comprobantes que emites.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">También conservamos el comprobante de pago que adjuntas y el registro de las conversaciones necesarias para dar soporte y trazabilidad a tus emisiones.<\u002Fp>\n        <h4 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:16px;letter-spacing:-.02em;font-weight:700;margin:24px 0 9px;color:#123D2F\">6. Para qué los usamos<\u002Fh4>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">Usamos tus datos para emitir y firmar tus comprobantes, transmitirlos al SRI, entregarlos a tus clientes, generar tus reportes, gestionar tu plan y atender tu soporte. También para contactarte en el horario que agendaste.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">No vendemos tus datos ni los cedemos a terceros con fines comerciales. Los compartimos únicamente con la administración tributaria, con el procesador de pagos cuando pagas con tarjeta, y con los proveedores tecnológicos necesarios para operar el servicio.<\u002Fp>\n        <h4 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:16px;letter-spacing:-.02em;font-weight:700;margin:24px 0 9px;color:#123D2F\">7. Cuánto tiempo los guardamos<\u002Fh4>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">Conservamos tus comprobantes electrónicos por siete años, conforme al plazo que exige la normativa. El resto de tus datos se conserva mientras tu cuenta esté activa y durante el tiempo que la ley requiera después.<\u002Fp>\n        <h4 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:16px;letter-spacing:-.02em;font-weight:700;margin:24px 0 9px;color:#123D2F\">8. Tus derechos<\u002Fh4>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">Puedes solicitar en cualquier momento el acceso, la rectificación, la eliminación o la portabilidad de tus datos, así como retirar esta autorización. Escríbenos por WhatsApp o a nuestro correo de contacto y atendemos tu solicitud.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">El retiro de la autorización puede impedir que sigamos emitiendo comprobantes a tu nombre, ya que esos datos son indispensables para el servicio.<\u002Fp>\n        <h4 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:16px;letter-spacing:-.02em;font-weight:700;margin:24px 0 9px;color:#123D2F\">9. Cambios<\u002Fh4>\n        <p style=\"font-size:14px;line-height:1.65;color:#3E5A4E;margin:0 0 12px;text-wrap:pretty\">Si actualizamos este documento te avisamos por el mismo chat antes de que entre en vigor. Si continúas usando el servicio después del aviso, entendemos que aceptas la versión actualizada.<\u002Fp>\n        <div style=\"margin-top:22px;padding-top:16px;border-top:1px solid #EFF2EE;font-size:12.5px;color:#5A7267\">Última actualización: agosto de 2026 · Factuchat, Quito, Ecuador<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex-shrink:0;display:flex;gap:10px;padding:16px 28px 20px;border-top:1px solid #EFF2EE;background:#FBFCFA\">\n        <button sc-camel-on-click=\"{{ aceptarLegal }}\" type=\"button\" style=\"flex:1;background:#22C55E;border:none;color:#0A2A1F;padding:14px;border-radius:999px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .25s\" style-hover=\"background:#16A34A;color:#FFFFFF\">Acepto y continúo<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ cerrarLegal }}\" type=\"button\" style=\"background:none;border:1px solid #D6DED6;border-radius:999px;padding:14px 22px;font-family:inherit;font-size:15px;font-weight:600;color:#3E5A4E;cursor:pointer;transition:border-color .25s,color .25s\" style-hover=\"border-color:#123D2F;color:#123D2F\">Cerrar<\u002Fbutton>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ modalBanco }}\">\n  <div sc-camel-on-click=\"{{ fondoBanco }}\" style=\"position:fixed;inset:0;z-index:110;background:rgba(6,20,15,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;animation:fiSheetIn .3s cubic-bezier(.16,1,.3,1) both\">\n    <div style=\"position:relative;width:100%;max-width:520px;background:#FFFFFF;border:1px solid #E4E9E2;border-radius:22px;padding:26px 26px 24px;box-shadow:0 40px 80px -30px rgba(18,61,47,.6);max-height:88vh;overflow-y:auto\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px\">\n        <div>\n          <h3 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:21px;letter-spacing:-.025em;font-weight:700;margin:0 0 5px;color:#123D2F\">Transferencia bancaria<\u002Fh3>\n          <p style=\"font-size:13.5px;line-height:1.55;color:#3E5A4E;margin:0;max-width:44ch;text-wrap:pretty\">Transfiere el total a cualquiera de nuestras cuentas y sube el comprobante.<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ cerrarBanco }}\" type=\"button\" aria-label=\"Cerrar\" style=\"width:36px;height:36px;flex-shrink:0;padding:0;border:1px solid #E4E9E2;background:#FBFCFA;border-radius:11px;cursor:pointer;display:grid;place-items:center;transition:border-color .25s\" style-hover=\"border-color:#123D2F\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3E5A4E\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M5 5l14 14M19 5L5 19\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n                <div style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#16794A;margin-bottom:12px\">Nuestras cuentas<\u002Fdiv>\n                <div style=\"background:#FBFCFA;border:1px solid #E4E9E2;border-radius:16px;padding:16px 18px;margin-bottom:20px\">\n                  <div style=\"padding-bottom:14px;border-bottom:1px solid #E9EDE9;margin-bottom:14px\">\n                    <div style=\"font-family:'Familjen Grotesk',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.022em;color:#123D2F;margin-bottom:4px\">Libio Elvis Pareja Paredes<\u002Fdiv>\n                    <div style=\"font-size:13.5px;line-height:1.6;color:#3E5A4E\">C.I. 092373715-9 · ventas@factuchat.ai<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:11px\">\n                    <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#5A7267\">Cuentas de ahorros<\u002Fspan>\n                    <span style=\"font-size:12px;color:#5A7267\">Toca el número para copiarlo<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:grid;gap:8px\">\n                    <sc-for list=\"{{ cuentas }}\" as=\"c\" hint-placeholder-count=\"5\">\n                      <button sc-camel-on-click=\"{{ c.copiar }}\" type=\"button\" style=\"display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:14px;width:100%;text-align:left;font-family:inherit;background:{{ c.fondo }};border:1px solid {{ c.borde }};border-radius:12px;padding:11px 14px;cursor:pointer;transition:background .25s,border-color .25s\" style-hover=\"border-color:#22C55E;background:rgba(34,197,94,.06)\">\n                        <span style=\"font-size:14px;font-weight:600;color:#123D2F;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.banco }}<\u002Fspan>\n                        <span style=\"font-family:'SF Mono',ui-monospace,monospace;font-size:14.5px;letter-spacing:.03em;color:#16794A;white-space:nowrap\">{{ c.num }}<\u002Fspan>\n                        <span style=\"display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:{{ c.etColor }};white-space:nowrap;transition:color .25s\">\n                          <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2.4\"><\u002Frect><path d=\"M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1\"><\u002Fpath><\u002Fsvg>\n                          {{ c.etiqueta }}\n                        <\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <label style=\"font-size:12.5px;font-weight:600;color:#123D2F;margin-bottom:7px;display:block\">Comprobante de la transferencia<\u002Flabel>\n                <label style=\"display:flex;align-items:center;gap:13px;background:#FBFCFA;border:1px dashed #B7C4BB;border-radius:14px;padding:15px 17px;cursor:pointer;transition:border-color .25s,background .25s;animation:{{ animSubir }}\" style-hover=\"border-color:#22C55E;background:#FFFFFF;animation:none\">\n                  <sc-if value=\"{{ archivoUrl }}\">\n                    <span style=\"width:46px;height:46px;border-radius:11px;flex-shrink:0;border:1px solid #D6DED6;display:block;background-image:{{ archivoBg }};background-size:cover;background-position:center\"><\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ archivoPdf }}\">\n                    <span style=\"width:46px;height:46px;border-radius:11px;background:#FFFFFF;border:1px solid #E4E9E2;display:grid;place-items:center;flex-shrink:0;font-family:'Familjen Grotesk',sans-serif;font-size:10px;font-weight:700;color:#D93025\">PDF<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ sinArchivo }}\">\n                  <span style=\"width:38px;height:38px;border-radius:11px;background:rgba(34,197,94,.09);border:1px solid rgba(22,121,74,.24);display:grid;place-items:center;flex-shrink:0;animation:fiSubirIcono 1.6s ease-in-out infinite\">\n                    <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16794A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 17V5\"><\u002Fpath><path d=\"M6 11l6-6 6 6\"><\u002Fpath><path d=\"M4 19h16\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                  <\u002Fsc-if>\n                  <span style=\"flex:1;min-width:0\">\n                    <span style=\"display:block;font-size:14px;font-weight:600;color:#123D2F;margin-bottom:2px\">{{ archivoNombre }}<\u002Fspan>\n                    <span style=\"display:block;font-size:12.5px;color:#3E5A4E\">{{ labelPie }}<\u002Fspan>\n                  <\u002Fspan>\n                  <input type=\"file\" accept=\"image/*,.pdf\" sc-camel-on-change=\"{{ onArchivo }}\" style=\"position:absolute;width:1px;height:1px;opacity:0;pointer-events:none\">\n                <\u002Flabel>\n      <sc-if value=\"{{ hayArchivo }}\">\n        <button sc-camel-on-click=\"{{ cerrarBanco }}\" type=\"button\" style=\"width:100%;margin-top:18px;background:#22C55E;border:none;color:#0A2A1F;padding:14px;border-radius:999px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .25s\" style-hover=\"background:#16A34A;color:#FFFFFF\">Listo, volver al pedido<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sinArchivo }}\">\n        <button sc-camel-on-click=\"{{ cerrarBanco }}\" type=\"button\" style=\"width:100%;margin-top:18px;background:#EFF2EE;border:none;color:#3E5A4E;padding:14px;border-radius:999px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .25s,color .25s\" style-hover=\"background:#123D2F;color:#FAF9F5\">Cerrar<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ checkout }}\">\n  <div style=\"position:fixed;inset:0;z-index:100;background:#FAF9F5;overflow-y:auto;overflow-x:hidden\">\n    <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(37,211,102,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(37,211,102,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(90% 60% at 50% 0%,#000 30%,transparent 100%);mask-image:radial-gradient(90% 60% at 50% 0%,#000 30%,transparent 100%);pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;top:-90px;right:-90px;width:420px;height:420px;border-radius:50%;background:rgba(37,211,102,.14);filter:blur(120px);pointer-events:none\"><\u002Fdiv>\n\n    <div style=\"position:relative;z-index:1;max-width:1020px;margin:0 auto;padding:26px 24px 70px\">\n\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid rgba(18,61,47,.12);margin-bottom:34px\">\n        <div style=\"font-family:'Caveat',cursive;font-size:31px;line-height:1;font-weight:600;color:#16794A;letter-spacing:.01em\">Factuchat<span style=\"font-size:12px;vertical-align:super;margin-left:2px;opacity:.75\">®<\u002Fspan><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ cerrarCheckout }}\" type=\"button\" style=\"display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid #D6DED6;border-radius:999px;padding:9px 18px;font-family:inherit;font-size:13.5px;font-weight:600;color:#3E5A4E;cursor:pointer;transition:border-color .25s,color .25s\" style-hover=\"border-color:#123D2F;color:#123D2F\">← Volver a los planes<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ pedidoOk }}\">\n        <div style=\"max-width:640px;margin:24px auto 0\">\n\n          <div style=\"position:relative;background:#FFFFFF;border:1px solid #E4E9E2;border-radius:26px;padding:40px 38px 34px;box-shadow:0 34px 70px -38px rgba(18,61,47,.5);overflow:hidden\">\n            <div style=\"position:absolute;top:-70px;right:-60px;width:260px;height:260px;border-radius:50%;background:rgba(34,197,94,.14);filter:blur(90px);pointer-events:none\"><\u002Fdiv>\n\n            <div style=\"position:relative;z-index:1;text-align:center\">\n              <div style=\"position:relative;width:74px;height:74px;margin:0 auto 22px\">\n                <span style=\"position:absolute;inset:0;border-radius:50%;border:1px solid rgba(34,197,94,.4);animation:fiRing 3s ease-out infinite\"><\u002Fspan>\n                <span style=\"position:absolute;inset:0;border-radius:50%;background:rgba(34,197,94,.12);border:1px solid rgba(22,121,74,.3);display:grid;place-items:center\">\n                  <svg width=\"31\" height=\"31\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16794A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5.5 5.5L20 7\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"font-family:'Caveat',cursive;font-size:26px;line-height:1;font-weight:600;color:#16794A;margin-bottom:10px\">{{ okSaludo }}<\u002Fdiv>\n              <h2 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:33px;line-height:1.06;letter-spacing:-.032em;font-weight:700;margin:0 0 12px;color:#123D2F;text-wrap:balance\">{{ okTitulo }}<\u002Fh2>\n              <p style=\"font-size:15.5px;line-height:1.6;color:#3E5A4E;margin:0 auto 26px;max-width:46ch;text-wrap:pretty\">{{ okTexto }}<\u002Fp>\n\n              <div style=\"display:inline-flex;align-items:center;gap:9px;background:rgba(34,197,94,.09);border:1px solid rgba(22,121,74,.22);border-radius:999px;padding:9px 18px;margin-bottom:28px\">\n                <span style=\"width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block;animation:fiPulse 2s ease-in-out infinite;flex-shrink:0\"><\u002Fspan>\n                <span style=\"font-size:13.5px;font-weight:600;color:#16794A;white-space:nowrap\">{{ okEstado }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#E4E9E2;border:1px solid #E4E9E2;border-radius:16px;overflow:hidden;margin-bottom:26px\">\n              <div style=\"background:#FBFCFA;padding:15px 16px\">\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5A7267;margin-bottom:5px\">Pedido<\u002Fdiv>\n                <div style=\"font-family:'Familjen Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;color:#123D2F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ okRef }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FBFCFA;padding:15px 16px\">\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5A7267;margin-bottom:5px\">Plan<\u002Fdiv>\n                <div style=\"font-family:'Familjen Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;color:#123D2F\">{{ coNombre }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FBFCFA;padding:15px 16px\">\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5A7267;margin-bottom:5px\">Total<\u002Fdiv>\n                <div style=\"font-family:'Familjen Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.02em;color:#123D2F\">{{ coPrecio }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"position:relative;z-index:1;border-top:1px solid #EFF2EE;padding-top:24px\">\n              <div style=\"font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#5A7267;margin-bottom:16px\">Qué sigue<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:14px\">\n                <div style=\"display:flex;gap:13px;align-items:flex-start\">\n                  <span style=\"width:26px;height:26px;border-radius:9px;background:#123D2F;color:#5CE68F;display:grid;place-items:center;font-family:'Familjen Grotesk',sans-serif;font-size:12px;font-weight:700;flex-shrink:0\">1<\u002Fspan>\n                  <div style=\"font-size:14.5px;line-height:1.55;color:#3E5A4E;text-wrap:pretty\"><strong style=\"font-weight:600;color:#123D2F\">Un asesor te escribe por WhatsApp<\u002Fstrong> al {{ okTelefono }} para confirmar tu pedido.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:13px;align-items:flex-start\">\n                  <span style=\"width:26px;height:26px;border-radius:9px;background:#123D2F;color:#5CE68F;display:grid;place-items:center;font-family:'Familjen Grotesk',sans-serif;font-size:12px;font-weight:700;flex-shrink:0\">2<\u002Fspan>\n                  <div style=\"font-size:14.5px;line-height:1.55;color:#3E5A4E;text-wrap:pretty\"><strong style=\"font-weight:600;color:#123D2F\">Activamos tu cuenta<\u002Fstrong> y cargamos tu firma electrónica contigo, paso a paso.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:13px;align-items:flex-start\">\n                  <span style=\"width:26px;height:26px;border-radius:9px;background:#22C55E;color:#0A2A1F;display:grid;place-items:center;font-family:'Familjen Grotesk',sans-serif;font-size:12px;font-weight:700;flex-shrink:0\">3<\u002Fspan>\n                  <div style=\"font-size:14.5px;line-height:1.55;color:#3E5A4E;text-wrap:pretty\"><strong style=\"font-weight:600;color:#123D2F\">Emites tu primera factura<\u002Fstrong> desde el chat, el mismo día.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:14px;background:#123D2F;border-radius:20px;padding:20px 24px;margin-top:14px;color:#F1F5F0\">\n            <span  style=\"font-family:'Familjen Grotesk',sans-serif;font-size:19px;letter-spacing:-.022em;font-weight:700;margin:0;color:#123D2F\">Forma de pago<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n        <button sc-camel-on-click=\"{{ pagoWhats }}\" type=\"button\" style=\"width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;font-family:inherit;background:{{ waBg }};border:1px solid {{ waBorde }};border-radius:14px;padding:13px 16px;cursor:pointer;transition:border-color .25s,background .25s,box-shadow .3s\" style-hover=\"border-color:#22C55E\">\n          <span style=\"width:20px;height:20px;border-radius:50%;border:1.5px solid {{ waDot }};display:grid;place-items:center;flex-shrink:0;margin-top:2px;transition:border-color .25s\">\n            <span style=\"width:10px;height:10px;border-radius:50%;background:{{ waDot }};transform:scale({{ waDotScale }});transition:transform .3s cubic-bezier(.16,1,.3,1)\"><\u002Fspan>\n          <\u002Fspan>\n          <span style=\"flex:1;min-width:0\">\n            <span style=\"display:block;font-family:'Familjen Grotesk',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.02em;color:#123D2F;margin-bottom:3px\">Solicitar información<\u002Fspan>\n            <sc-if value=\"{{ esWhats }}\">\n              <span style=\"display:block;font-size:13.5px;line-height:1.5;color:#3E5A4E;text-wrap:pretty;margin-top:2px\">Agendas cuándo te contactamos y hablamos por WhatsApp. Ahí coordinamos el pago y activamos tu plan.<\u002Fspan>\n            <\u002Fsc-if>\n\n          <\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ pagoTransfer }}\" type=\"button\" style=\"width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;font-family:inherit;background:{{ trBg }};border:1px solid {{ trBorde }};border-radius:14px;padding:13px 16px;cursor:pointer;transition:border-color .25s,background .25s,box-shadow .3s\" style-hover=\"border-color:#22C55E\">\n          <span style=\"width:20px;height:20px;border-radius:50%;border:1.5px solid {{ trDot }};display:grid;place-items:center;flex-shrink:0;margin-top:2px;transition:border-color .25s\">\n            <span style=\"width:10px;height:10px;border-radius:50%;background:{{ trDot }};transform:scale({{ trDotScale }});transition:transform .3s cubic-bezier(.16,1,.3,1)\"><\u002Fspan>\n          <\u002Fspan>\n          <span style=\"flex:1;min-width:0\">\n            <span style=\"display:block;font-family:'Familjen Grotesk',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.02em;color:#123D2F;margin-bottom:3px\">Transferencia o depósito bancario<\u002Fspan>\n            <sc-if value=\"{{ esTransfer }}\">\n              <span style=\"display:block;font-size:13.5px;line-height:1.5;color:#3E5A4E;text-wrap:pretty;margin-top:2px\">Te mostramos las cuentas, transfieres y subes el comprobante. Activamos tu plan al confirmar el pago.<\u002Fspan>\n            <\u002Fsc-if>\n\n          <\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ pagoTarjeta }}\" type=\"button\" style=\"width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;font-family:inherit;background:{{ tjBg }};border:1px solid {{ tjBorde }};border-radius:14px;padding:13px 16px;cursor:pointer;transition:border-color .25s,background .25s,box-shadow .3s\" style-hover=\"border-color:#22C55E\">\n          <span style=\"width:20px;height:20px;border-radius:50%;border:1.5px solid {{ tjDot }};display:grid;place-items:center;flex-shrink:0;margin-top:2px;transition:border-color .25s\">\n            <span style=\"width:10px;height:10px;border-radius:50%;background:{{ tjDot }};transform:scale({{ tjDotScale }});transition:transform .3s cubic-bezier(.16,1,.3,1)\"><\u002Fspan>\n          <\u002Fspan>\n          <span style=\"flex:1;min-width:0\">\n            <span style=\"display:block;font-family:'Familjen Grotesk',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.02em;color:#123D2F;margin-bottom:3px\">Tarjeta de crédito o débito <span style=\"font-weight:400;color:#3E5A4E\">(Payphone)<\u002Fspan><\u002Fspan>\n            <sc-if value=\"{{ esTarjeta }}\">\n              <span style=\"display:block;font-size:13.5px;line-height:1.5;color:#3E5A4E;text-wrap:pretty;margin-top:2px\">Pago en línea seguro. Al confirmar te llevamos a Payphone para completar la transacción.<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ esTarjeta }}\">\n            <span style=\"display:flex;gap:7px;margin-top:11px;flex-wrap:wrap\">\n              <span style=\"width:46px;height:30px;border-radius:6px;border:1px solid #E4E9E2;background:#FFFFFF;display:grid;place-items:center\"><span style=\"font-family:'Familjen Grotesk',sans-serif;font-style:italic;font-weight:700;font-size:13px;letter-spacing:-.02em;color:#1A1F71\">VISA<\u002Fspan><\u002Fspan>\n              <span style=\"width:46px;height:30px;border-radius:6px;border:1px solid #E4E9E2;background:#FFFFFF;display:grid;place-items:center\"><span style=\"position:relative;display:block;width:34px;height:20px\"><span style=\"position:absolute;left:2px;top:1px;width:18px;height:18px;border-radius:50%;background:#EB001B\"><\u002Fspan><span style=\"position:absolute;right:2px;top:1px;width:18px;height:18px;border-radius:50%;background:#F79E1B;mix-blend-mode:multiply\"><\u002Fspan><\u002Fspan><\u002Fspan>\n              <span style=\"width:46px;height:30px;border-radius:6px;border:1px solid #E4E9E2;background:#FFFFFF;display:grid;place-items:center;padding:0 4px\"><img src=\"062a038a-b6ea-4b80-9e1b-538a558335e4\" alt=\"Discover\" style=\"max-width:100%;max-height:15px;object-fit:contain;display:block\"><\u002Fspan>\n              <span style=\"width:46px;height:30px;border-radius:6px;border:1px solid #E4E9E2;background:#FFFFFF;display:grid;place-items:center;padding:0 5px\"><img src=\"44638289-ec83-458d-a400-6c277abe2585\" alt=\"Diners Club\" style=\"max-width:100%;max-height:20px;object-fit:contain;display:block\"><\u002Fspan>\n            <\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fspan>\n        <\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ esTransfer }}\">\n              <div style=\"margin-top:18px;border-top:1px solid #EFF2EE;padding-top:18px;display:flex;gap:12px;align-items:flex-start\">\n                <span style=\"width:30px;height:30px;border-radius:9px;background:rgba(34,197,94,.09);border:1px solid rgba(22,121,74,.24);display:grid;place-items:center;flex-shrink:0\">\n                  <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16794A\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20h16\"><\u002Fpath><path d=\"M5 20V9.5l7-4.5 7 4.5V20\"><\u002Fpath><path d=\"M9.5 20v-5h5v5\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n                <div style=\"font-size:13.5px;line-height:1.6;color:#3E5A4E;text-wrap:pretty\">Usa el botón <strong style=\"font-weight:600;color:#123D2F\">Subir documento de transferencia<\u002Fstrong> del resumen para ver nuestras cuentas y adjuntar tu comprobante.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ esTarjeta }}\">\n              <div style=\"margin-top:18px;border-top:1px solid #EFF2EE;padding-top:18px;display:flex;gap:12px;align-items:flex-start\">\n                <span style=\"width:30px;height:30px;border-radius:9px;background:rgba(34,197,94,.09);border:1px solid rgba(22,121,74,.24);display:grid;place-items:center;flex-shrink:0\">\n                  <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#16794A\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5.5\" width=\"18\" height=\"13\" rx=\"2.6\"><\u002Frect><path d=\"M3 10h18\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n                <div style=\"font-size:13.5px;line-height:1.6;color:#3E5A4E;text-wrap:pretty\">No guardamos los datos de tu tarjeta. El cobro lo procesa <strong style=\"font-weight:600;color:#123D2F\">Payphone<\u002Fstrong> en su propia pasarela y vuelves aquí con el pago confirmado.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ esWhats }}\">\n              <div style=\"margin-top:18px;border-top:1px solid #EFF2EE;padding-top:18px;display:flex;gap:12px;align-items:flex-start\">\n                <span style=\"width:30px;height:30px;border-radius:9px;background:rgba(34,197,94,.09);border:1px solid rgba(22,121,74,.24);display:grid;place-items:center;flex-shrink:0\">\n                  <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"#16794A\"><path d=\"M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38a9.9 9.9 0 004.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2z\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n                <div style=\"font-size:13.5px;line-height:1.6;color:#3E5A4E;text-wrap:pretty\">Acepta los dos permisos de abajo y elige el día y la hora en que quieres que te llamemos. Después se abre WhatsApp con todo tu pedido escrito.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:sticky;top:26px;background:#123D2F;border-radius:22px;padding:26px 26px 24px;color:#F1F5F0;box-shadow:0 26px 52px -30px rgba(18,61,47,.6)\">\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#5CE68F;margin-bottom:16px\">Tu pedido<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px\">\n            <div style=\"font-family:'Familjen Grotesk',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.028em;color:#FFFFFF\">Plan {{ coNombre }}<\u002Fdiv>\n            <div style=\"font-family:'Familjen Grotesk',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.03em;color:#FFFFFF;white-space:nowrap\">{{ coPrecio }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.5;color:#A6BFB2;margin-bottom:20px\">{{ coDetalle }}<\u002Fdiv>\n          <div style=\"border-top:1px solid #2A5344;padding-top:16px;display:flex;flex-direction:column;gap:9px;font-size:13.5px;color:#DDE8E0\">\n            <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#A6BFB2\">Comprobantes<\u002Fspan><span>{{ coCupo }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#A6BFB2\">Vigencia<\u002Fspan><span>{{ coVigencia }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#A6BFB2\">IVA<\u002Fspan><span>Incluido<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #2A5344;margin-top:16px;padding-top:16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n            <span style=\"font-size:14.5px;font-weight:600;color:#FFFFFF\">Total a pagar<\u002Fspan>\n            <span style=\"font-family:'Familjen Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.035em;color:#5CE68F\">{{ coPrecio }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hayArchivo }}\">\n            <div style=\"margin-top:20px;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(92,230,143,.28);border-radius:14px;padding:10px 12px\">\n              <sc-if value=\"{{ archivoUrl }}\">\n                <span style=\"width:54px;height:54px;border-radius:10px;flex-shrink:0;border:1px solid rgba(92,230,143,.35);display:block;background-image:{{ archivoBg }};background-size:cover;background-position:center\"><\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ archivoPdf }}\">\n                <span style=\"width:54px;height:54px;border-radius:10px;background:#FFFFFF;display:grid;place-items:center;flex-shrink:0;font-family:'Familjen Grotesk',sans-serif;font-size:11px;font-weight:700;color:#D93025\">PDF<\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"flex:1;min-width:0\">\n                <span style=\"display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5CE68F;margin-bottom:3px\">Comprobante adjunto<\u002Fspan>\n                <span style=\"display:block;font-size:13px;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ archivo }}<\u002Fspan>\n                <span style=\"display:block;font-size:12px;color:#A6BFB2;margin-top:1px\">{{ archivoPeso }}<\u002Fspan>\n              <\u002Fspan>\n              <button sc-camel-on-click=\"{{ quitarArchivo }}\" type=\"button\" aria-label=\"Quitar\" style=\"width:28px;height:28px;flex-shrink:0;padding:0;border:1px solid rgba(255,255,255,.16);background:none;border-radius:9px;cursor:pointer;display:grid;place-items:center;transition:border-color .25s\" style-hover=\"border-color:#5CE68F\">\n                <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A6BFB2\" stroke-width=\"2.3\" stroke-linecap=\"round\"><path d=\"M5 5l14 14M19 5L5 19\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ esTransfer }}\">\n            <sc-if value=\"{{ hayArchivo }}\">\n              <button sc-camel-on-click=\"{{ abrirBanco }}\" type=\"button\" style=\"width:100%;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(92,230,143,.16);border:1px solid #5CE68F;color:#5CE68F;padding:14px;border-radius:999px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .25s\" style-hover=\"background:rgba(92,230,143,.26);color:#FFFFFF\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5.5 5.5L20 7\"><\u002Fpath><\u002Fsvg>\n                Comprobante adjunto\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sinArchivo }}\">\n              <button sc-camel-on-click=\"{{ abrirBanco }}\" type=\"button\" style=\"position:relative;width:100%;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid rgba(92,230,143,.35);color:#FFFFFF;padding:14px;border-radius:999px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:border-color .25s,background .25s\" style-hover=\"border-color:#5CE68F;background:rgba(92,230,143,.18);color:#FFFFFF\">\n                <span style=\"position:absolute;inset:-1px;border-radius:999px;border:1px solid transparent;pointer-events:none;animation:fiSubirGlow 2.6s ease-in-out infinite\"><\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:9px;animation:fiSubirIcono 2.6s ease-in-out infinite;flex-shrink:0\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5CE68F\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 17V5M6 11l6-6 6 6M4 19h16\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n                <span style=\"display:grid;flex:0 1 auto;min-width:0;align-items:center;justify-items:center\">\n                  <span style=\"grid-area:1/1;text-align:center;animation:fiFraseA 5.2s ease-in-out infinite\">Subir documento de transferencia<\u002Fspan>\n                  <span style=\"grid-area:1/1;text-align:center;color:#5CE68F;animation:fiFraseB 5.2s ease-in-out infinite\">Presiona aquí<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n          <div style=\"border-top:1px solid #2A5344;margin-top:20px;padding-top:6px\">\n          <button sc-camel-on-click=\"{{ togCond }}\" type=\"button\" style=\"width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;font-family:inherit;background:none;border:none;border-radius:10px;padding:12px 10px;margin-top:6px;cursor:pointer;transition:background .22s\" style-hover=\"background:rgba(92,230,143,.08)\">\n            <span style=\"display:grid;place-items:center;width:22px;height:22px;flex-shrink:0;margin-top:1px\">\n              <sc-if value=\"{{ condSi }}\">\n                <span style=\"width:22px;height:22px;border-radius:7px;border:1.5px solid #22C55E;background:#22C55E;display:grid;place-items:center;flex-shrink:0\">\n                  <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2A1F\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5l5.5 5.5L20 7\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ condNo }}\">\n                <span style=\"width:22px;height:22px;border-radius:7px;border:1.5px solid #4A6B5C;background:transparent;display:block;flex-shrink:0\"><\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fspan>\n            <span style=\"flex:1;min-width:0;font-size:12.5px;line-height:1.55;color:#B6CBBE;text-wrap:pretty\">Acepto los <strong style=\"font-weight:600;color:#FFFFFF\">términos y condiciones de uso<\u002Fstrong> y el <strong style=\"font-weight:600;color:#FFFFFF\">tratamiento de mis datos<\u002Fstrong> para emitir mis comprobantes y activar mi cuenta.<\u002Fspan>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ abrirLegal }}\" type=\"button\" style=\"display:block;margin:2px 0 4px 44px;background:none;border:none;padding:0;font-family:inherit;font-size:12.5px;font-weight p data-reveal=\"1\" data-delay=\"360\" style=\"font-size:17px;line-height:1.62;color:#3E5A4E;margin:0;max-width:48ch;text-wrap:pretty\">Olvídate de plataformas complejas y manuales de usuario. Escribe lo que vendiste por WhatsApp y nuestra IA genera el comprobante electrónico validado por el SRI en segundos.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" data-delay=\"460\" style=\"position:relative;display:flex;flex-direction:column;gap:48px;padding-left:56px\">\n        <div style=\"position:absolute;left:22px;top:14px;bottom:44px;width:1px;background:rgba(18,61,47,.14);overflow:hidden\">\n          <div style=\"position:absolute;left:0;width:100%;height:34%;background:linear-gradient(180deg,transparent,#16794A,transparent);animation:fiFlow 3.6s linear infinite\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-left:0px;position:relative;animation:fiFloatA 6.5s ease-in-out infinite\">\n          <span style=\"position:absolute;left:-34px;top:14px;width:9px;height:9px;border-radius:50%;background:#16794A;box-shadow:0 0 12px 2px rgba(34,197,94,.55)\"><\u002Fspan>\n          <span style=\"position:absolute;left:-25px;top:18px;width:25px;height:1px;background:linear-gradient(90deg,rgba(22,121,74,.5),rgba(22,121,74,.05))\"><\u002Fspan>\n          <div sc-camel-on-mouse-enter=\"{{ cardOn }}\" sc-camel-on-mouse-leave=\"{{ cardOff }}\" style=\"display:flex;gap:16px;align-items:flex-start;will-change:transform;backface-visibility:hidden;transition:transform .45s cubic-bezier(.16,1,.3,1)\" style-hover=\"transform:translateX(7px)\">\n            <span data-icon=\"1\" style=\"width:40px;height:40px;border-radius:13px;background:rgba(34,197,94,.09);border:1px solid rgba(22,121,74,.28);display:grid;place-items:center;flex-shrink:0;will-change:transform;backface-visibility:hidden;will-change:transform;backface-visibility:hidden;will-change:transform;backface-visibility:hidden;will-change:transform;backface-visibility:hidden;will-change:transform;backface os\" data-glowzone=\"1\" style=\"position:relative;background:#07231B;padding:104px 0 110px;overflow:hidden\">\n    <x-import component-from-global-scope=\"fi-webgl\" from=\"9f724970-c264-4f3f-95d0-e70a6a8b499e#/hero-webgl.js\" accent=\"#5CE68F\" background=\"#07231B\" hint-size=\"100%,100%\"><\u002Fx-import>\n    <div style=\"position:absolute;inset:0;background:radial-gradient(120% 110% at 30% 18%,rgba(7,35,27,.92) 0%,rgba(7,35,27,.8) 44%,rgba(7,35,27,.46) 80%,rgba(7,35,27,.2) 100%);pointer-events:none\"><\u002Fdiv>\n    <div data-glow=\"1\" style=\"position:absolute;top:0;left:0;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;background:radial-gradient(circle,rgba(92,230,143,.16),transparent 68%);pointer-events:none;opacity:0;transition:opacity .45s ease\"><\u002Fdiv>\n    <div style=\"position:absolute;top:0;left:0;right:0;height:1px;overflow:hidden\"><div style=\"width:24%;height:100%;background:linear-gradient(90deg,transparent,#5CE68F,transparent);animation:fiSweep 8s linear infinite\"><\u002Fdiv><\u002Fdiv>\n\n    <div style=\"position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 24px\">\n      <div data-reveal=\"1\" style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:48px;flex-wrap:wrap;margin-bottom:46px\">\n        <div>\n          <div style=\"display:inline-flex;align-items:center;gap:9px;font-family:'SF Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8FB3A0;margin-bottom:20px\">\n            <span style=\"width:6px;height:6px;border-radius:50%;background:#22C55E;display:inline-block;animation:fiPulse 2.4s ease-in-out infinite\"><\u002Fspan>\n            Esquema de comprobantes electrónicos\n          <\u002Fdiv>\n          <h2 style=\"font-family:'Familjen Grotesk',sans-serif;font-size:44px;line-height:1.04;letter-spacing:-.034em;font-weight:700;margin:0;color:#FFFFFF;max-width:22ch;text-wrap:balance\">Los seis documentos del SRI. Todos, con su
